<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demos — Jacob Tartabini</title>
    <meta
      name="description"
      content="A collection of demo projects by Jacob Tartabini."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0c0c0d;
        --surface: #161618;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #c4b5fd;
        --accent-dim: rgba(196, 181, 253, 0.12);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --surface: #ffffff;
          --border: rgba(0, 0, 0, 0.08);
          --text: #18181b;
          --muted: #71717a;
          --accent: #6d28d9;
          --accent-dim: rgba(109, 40, 217, 0.08);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "Inter", system-ui, sans-serif;
        background:
          radial-gradient(
            ellipse 80% 50% at 50% -20%,
            var(--accent-dim),
            transparent
          ),
          var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 5rem 1.5rem 4rem;
      }

      header {
        margin-bottom: 3rem;
      }

      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(2.5rem, 8vw, 3.5rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .subtitle {
        margin-top: 0.75rem;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .demos {
        display: grid;
        gap: 0.75rem;
        list-style: none;
      }

      .demo-card {
        display: block;
        padding: 1.25rem 1.5rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.875rem;
        text-decoration: none;
        color: inherit;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }

      .demo-card:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .demo-card h2 {
        font-size: 1.125rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .demo-card p {
        color: var(--muted);
        font-size: 0.925rem;
      }

      .demo-card .path {
        display: inline-block;
        margin-top: 0.625rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        color: var(--accent);
      }

      footer {
        margin-top: 3rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.875rem;
      }

      footer a {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Demos</h1>
        <p class="subtitle">Experiments and side projects.</p>
      </header>

      <ul class="demos">
        <li>
          <a class="demo-card" href="/obol">
            <h2>Obol</h2>
            <p>Demo project routed via Vercel rewrites.</p>
            <span class="path">/obol</span>
          </a>
        </li>
      </ul>

      <footer>
        <a href="https://jacobtartabini.com">jacobtartabini.com</a>
      </footer>
    </main>
  </body>
</html>
